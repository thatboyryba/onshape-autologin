<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 240px; padding: 12px; }
    input { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 6px; }
    button { padding: 6px 12px; }
    #status { font-size: 12px; color: #2a7; margin-left: 8px; }
  </style>
</head>
<body>
  <input id="email" type="email" placeholder="Onshape email" autocomplete="off">
  <input id="password" type="password" placeholder="Password" autocomplete="off">
  <button id="save">Save</button>
  <button id="clear">Clear</button>
  <span id="status"></span>
  <script src="popup.js"></script>
</body>
</html>
